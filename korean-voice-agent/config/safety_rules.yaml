# 출력 검사 규칙 (realtime_server/output_guard.py 가 읽음).
# Gemma 4 가 만든 문장을 TTS 로 보내기 전에 문장 단위로 검사한다. 하나라도 걸리면 그 문장 대신 replacement 를 읽고,
# 같은 응답의 나머지 문장은 내보내지 않는다.
# 금칙어 목록은 초기값이다. 운영 전에 교육·법무 담당자가 검토하고 보강해야 한다.

version: 1

replacement: "그 이야기는 하지 않을게요. 우리 하던 공부를 계속해 볼까요?"

# 문장에 포함되면 차단하는 단어 (공백을 지우고 비교)
banned_words:
  profanity: [씨발, 시발, 씨팔, 개새끼, 병신, 좆, 존나, 꺼져, 닥쳐, 미친놈, 미친년]
  sexual: [섹스, 성관계, 야동, 포르노, 자위]
  self_harm: [자살 방법, 자해 방법, 죽는 방법]
  violence: [죽여 버, 죽일 거, 폭탄 만드는]
  drugs: [마약 구하, 대마초 피우]

# 대화 상대(아동)에게 개인정보를 묻는 문장 (정규식).
# "이 동물의 이름은 뭐예요?", "토끼가 사는 곳은 어디일까요?" 같은 학습 퀴즈는 통과시켜야 하므로,
# 상대에게 직접 묻는 형태만 잡는다. 오탐·미탐 사례는 tests/test_output_guard.py 에 있다.
pii_request_patterns:
  - id: ask_name
    # "너의 이름", "친구 이름" 처럼 상대를 가리키는 말이 있거나, 앞에 "~의" 수식이 없는 "이름이 뭐예요?"
    pattern: '((너|네|니|당신|친구|본인|자기)\s*(의)?\s*(이름|성함)|(?<!의 )(?<!의)(?<![가-힣] )(?<![가-힣])(이름|성함))\s*(이|은|는|을|를|좀)?\s*(뭐(예요|에요|야|니|지|냐)|알려|말해|가르쳐)'
  - id: ask_address
    pattern: '(주소|어디\s*사(니|세요|는지|냐|는\s*거야)|(너|네|니)\s*(의)?\s*집\s*(이|은)?\s*어디|집\s*(이|은)\s*어디(야|예요|에요|니)|몇\s*동\s*몇\s*호)'
  - id: ask_school
    pattern: '(학교|학원|유치원|어린이집)\s*(이름)?\s*(이|은|는|가)?\s*(어디|뭐(예요|에요|야|니)|무슨|알려|말해)'
  - id: ask_phone
    pattern: '(전화\s*번호|휴대\s*폰\s*번호|핸드폰\s*번호|연락처)'
  - id: ask_meet
    pattern: '((직접|우리|나랑|선생님이랑|선생님하고)\s*만나|놀러\s*와|찾아\s*갈게|사진\s*(보내|찍어\s*보내))'

# 답변 안에 들어 있으면 안 되는 개인정보 형태
pii_value_patterns:
  - id: phone_number
    pattern: '01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}'
  - id: email
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  - id: rrn
    pattern: '\d{6}[-\s]?[1-4]\d{6}'
