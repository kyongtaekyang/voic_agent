# 한국어 Agent 서비스 설정 (프롬프트 4절). 포트는 ada-ops/ports.md 와 같이 고친다.

profile: realtime            # realtime | korean_only (프롬프트 9.2절 단독 프로필)

ports:
  web: 7201                  # 한국어 Agent 화면 + 화면용 WebSocket 중계
  realtime_server: 8766      # speech-to-speech Realtime 서버 (8765 는 다른 프로그램이 사용 중)
  gemma_vllm: 8001
  transcribe_vllm: 8002      # 후처리 모드 (8000 은 다른 프로그램이 사용 중)

llm:
  # 3단계 결과로 정한다. GPU 여유가 부족한 동안에는 프롬프트 9.2절의 대체안인 E4B 를 쓴다.
  model: google/gemma-4-E4B-it
  served_name: gemma-4
  quantization: fp8          # vLLM 온라인 FP8. 26B A4B 는 4비트(AWQ) 또는 FP8 가중치를 쓴다
  gpu_memory_utilization: 0.22
  max_model_len: 4096
  temperature: 0.6
  max_new_tokens: 160
  disable_thinking: true     # 실시간 턴에서는 Thinking 을 끈다 (프롬프트 1.1절)
  chat_size: 8               # 대화 이력 턴 수
  system_prompt_file: config/prompts/korean_tutor_system.md

stt:
  model: /home/yang/pgm/Korean_interface/models/stt/nemotron-3.5-asr-streaming-0.6b
  device: cpu                # 1단계: CPU RTF 가 1.0 미만이므로 CPU 유지
  language: ko-KR            # ko-KR | auto (auto 는 발화별 언어 태그로 영어 발화를 감지)
  threads: 8
  mismatch_turns: 2          # 영어 위주 발화가 이 횟수만큼 이어지면 language_mismatch

tts:
  backend: qwen3
  model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice   # ggml 백엔드는 HF 모델 ID 만 받음
  qwen3_backend: ggml
  device: cuda
  speaker: sohee
  language: Korean

turn:
  vad_threshold: 0.5
  min_silence_ms: 400        # VAD 무음 기준. 5단계에서 어미 기반 보조 판정과 비교
  smart_turn: true
  # 아래 셋은 speech-to-speech 1.1.0 기본값. 5단계(끼어들기 300ms, 응답 지연)에서 조정한다.
  min_speech_ms: 384         # 발화 시작(끼어들기)으로 인정하는 최소 음성 길이 → 끼어들기 감지 지연의 하한
  speech_pad_ms: 500         # 구간 앞뒤 여유. speech_started 의 audio_start_ms 는 이만큼 앞당겨진 값이다
  speculative_reopen_ms: 800 # Smart Turn 완료 뒤 이 시간 동안 응답 음성을 붙잡아 둔다(말을 이어 하면 턴을 다시 연다)

web:
  host: 127.0.0.1            # 마이크 권한 때문에 localhost 로만 연다. 사내 접속은 SSH 터널 (README 참고)
  english_agent_url: http://localhost:7101/   # 영어 발화 안내에 표시할 영어 Agent 화면 주소
  dev_screen: true           # 개발자 화면 허용 (주소 끝에 ?dev=1 을 붙여야 보인다). 아동 대상 운영에서는 false
  require_realtime_mode: true  # ada-ops 운영 모드가 realtime 이 아니면 "현재 점검 중" 표시
  ops_dir: /home/yang/pgm/voice_agent/ada-ops

features:
  output_guard: true
  text_normalizer: true
  stream_batch_sentences: 1  # 문장 하나가 끝나면 바로 TTS 로 보낸다 (기본값 3 은 첫 음성이 늦어짐)
  log_transcripts: false     # 아동 발화 원문을 서버 로그에 남기지 않는다
