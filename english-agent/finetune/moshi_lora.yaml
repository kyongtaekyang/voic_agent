# moshi-finetune LoRA 학습 설정 초안 (프롬프트 3절, 8단계). 아직 실행하지 않음 (학습 데이터와 학습 모드 GPU 시간 미정).
# 기준: kyutai-labs/moshi-finetune 2acc879 의 example/moshi_7B.yaml 과 README 권장값. 바꾼 값에는 이유를 적었다.
# 실행 (학습 모드에서만: 영어·한국어 Agent 를 모두 멈추고, 다른 사용자의 GPU 사용도 확인한 뒤)
#   cd ~/opt/moshi-finetune && torchrun --nproc-per-node 1 -m train /home/yang/pgm/voice_agent/english-agent/finetune/moshi_lora.yaml

data:
  train_data: /home/yang/pgm/voice_agent/english-agent/finetune/data/pairs.jsonl   # prepare.py 결과. 큐 세션이면 queue.jsonl
  eval_data: ''               # 평가 세트를 정하면 채운다 (원본과 파인튜닝 모델을 같은 세트로 비교: 프롬프트 3절)
  shuffle: true

moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"   # 1단계와 같은 모델 (HF 캐시에 이미 있음)

full_finetuning: false
lora:
  enable: true
  rank: 128
  scaling: 2.
  ft_embed: false

first_codebook_weight_multiplier: 100.
text_padding_weight: .5

# 공식 권장값 (1×H100 에서 최대 할당 39.6 GB). Ada 48 GB 는 다른 프로그램(baek 등)이 함께 쓰므로 그대로는 넘칠 수 있다.
# 메모리가 부족하면 batch_size 를 먼저 줄이고(16 → 8 → 4), 그래도 부족하면 duration_sec 를 줄인다 (100 → 60).
# duration_sec 를 줄이면 추론 때 모델이 더 빨리 조용해질 수 있다고 README 에 적혀 있다. 바꾼 값과 영향은 보고서에 기록한다.
duration_sec: 100
batch_size: 16
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2e-6
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 1
eval_freq: 100
do_eval: false
do_ckpt: true
ckpt_freq: 100
save_adapters: true

run_dir: /home/yang/pgm/voice_agent/english-agent/finetune/runs/lora_v0   # 저장소 제외. 이미 있으면 train.py 가 멈춤
# wandb 는 쓰지 않는다 (학습 기록을 외부로 보내지 않음: 프롬프트 7절)
