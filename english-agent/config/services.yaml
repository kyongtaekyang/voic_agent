# 영어 Agent 서비스 설정 (프롬프트 4절). 포트를 바꾸려면 ada-ops/ports.md 를 먼저 고친다.

moshi:
  # 1단계: PyTorch BF16 (ada-ops/services/en-moshi-bf16.sh, 영어 단독 프로필 en-solo)
  # 운영: Rust/Candle INT8 (config-q8.json, 2단계에서 설치)
  backend: pytorch            # pytorch | rust
  hf_repo: kyutai/moshiko-pytorch-bf16   # 여성 음성: kyutai/moshika-pytorch-bf16
  url: ws://127.0.0.1:8998/api/chat
  sample_rate: 24000          # 단말이 다른 샘플레이트면 Gateway 입구에서 리샘플링

safety:
  rules: config/safety_rules.yaml
  # 출력 음성 지연 버퍼 (ms). 0 이면 텍스트와 음성을 바로 내보낸다. 2단계 실측 후 200~400 사이에서 정한다 (프롬프트 2.2절 5번).
  output_delay_ms: 0
  idle_ms: 160                # 텍스트 토큰 없이 이만큼 지나면 SafetyMonitor.idle() (발화 끝 단어 확정)
  unmute_quiet_ms: 1000       # 차단 뒤 Moshi 가 이만큼 조용해지면 출력 재개

gateway:
  require_mode: true          # ada-ops/run/mode 가 realtime 또는 en-solo 가 아니면 "점검 중"
  record: false               # queue_dir 에 세션 녹음 (Slow Path 용). 녹음 동의·보관 기간 정책이 정해진 뒤 true
  handshake_timeout_s: 60     # Moshi 가 다른 연결을 처리 중이면 handshake 를 늦게 준다

asr:
  enabled: true               # english-agent/.venv 에 transformers 필요
  preload: true
  model: /home/yang/pgm/Korean_interface/models/stt/nemotron-3.5-asr-streaming-0.6b
  device: cpu                 # CPU RTF 0.43 (lookahead 3, 8스레드) 이므로 CPU 유지
  threads: 8
  lookahead: 3
  language: auto              # en-US 고정은 한국어를 빈 결과로 버려서 감지 불가 (docs/reports/cpu_prebuild_20261116.md)
  mismatch_turns: 2
  hangul_ratio_min: 0.3

web:
  screen_port: 7101
  core_port: 7102
  korean_agent_url: http://127.0.0.1:7201/   # 비영어 발화 안내에 표시할 링크 (SSH 터널 기준)
  developer_panel: false

queue_dir: queue/english      # Slow Path 녹음 대기열 (저장소에 올리지 않음)

# 사람 튜터 녹음 스튜디오 (studio/server.py, 프롬프트 3절 학습 데이터). GPU 를 쓰지 않으며 운영 모드와 무관하게 띄운다 (ada-ops/studio).
studio:
  port: 7103                  # ada-ops/ports.md
  queue_dir: queue/tutor      # 세션마다 tutor.wav, student.wav, meta.json (저장소에 올리지 않음)
  gap_fill_ms: 200            # 프레임이 기준 시각보다 이만큼 이상 늦으면 그 사이를 무음으로 채워 두 트랙 시간을 맞춘다
  finetune_out: finetune/data # 삭제(동의 철회) 때 여기서 파생 학습 데이터도 지운다

# 학습 데이터 변환 (finetune/prepare.py)
finetune:
  # 아동 음성을 학습 데이터로 바꿀지. 프롬프트 3절: 법정대리인 동의와 내부관리규정 검토가 끝나기 전에는 쓰지 않는다.
  # 아동 녹음 자체는 법정대리인 동의가 있으면 스튜디오에서 할 수 있다. 검토가 끝난 뒤에만 true 로 바꾼다.
  allow_child_data: false

# Slow Path (프롬프트 5절 6단계, 후처리 모드). ada-ops/nightly-batch 가 한국어 Agent 와 같은 Transcribe 30B(:8002)로 처리한다.
# 녹음(gateway.record)이 꺼져 있으면 대기열이 비어 있으므로 아무 일도 하지 않는다.
slow_path:
  queue_dir: queue/english
  transcribe_url: http://127.0.0.1:8002      # 127.0.0.1 만 허용 (slow_path/run.py local_only)
  transcribe_model: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
  transcribe_prompt: "Transcribe the following audio."   # 축어 전사 지시문은 모델 카드 템플릿으로 확정할 것 (미검증)
  context_terms: []
  transcribe_max_tokens: 8192
  timeout_s: 1800
  audit_agent_audio: true     # agent.wav 도 전사해서 안전 규칙으로 다시 검사 (세션당 Transcribe 호출 2회)
  vad:                        # 응답 지연 근사치 계산용 에너지 기준
    frame_ms: 20
    rms: 0.01
    min_silence_ms: 500
    min_speech_ms: 100
    max_gap_s: 5.0
    yield_ms: 1000            # 사용자가 끼어든 뒤 Agent 가 이 안에 멈추면 '양보함' (slow_path/turns.py)
    cut_min_ms: 500           # Agent 가 끼어든 뒤 사용자 발화가 이만큼 이상 이어지면 '말을 끊음'
  # LoRA 파인튜닝 후보 분류 (프롬프트 2.5절 4번, slow_path/candidate.py). 값은 초안이며 실제 세션을 보고 조정한다.
  # 개인정보 규칙은 config/finetune_pii.yaml. 걸리면 needs_review (사람 확인 전에는 학습에 쓰지 않음)
  finetune_candidate:
    require_consent: true     # meta.json consent.finetune == true 인 세션만 (프롬프트 3절: 성인·적법 확보 녹음, 아동은 동의 전 금지)
    min_user_speech_s: 20
    min_user_turns: 3
    max_non_english_turn_ratio: 0.1
    user_speech_ratio: [0.2, 0.7]
    max_agent_cuts_user_rate: 0.2
    require_audit: true       # audit_agent_audio 로 Agent 음성 사후 안전 검사를 했어야 함
