# Safety Monitor 규칙 (core/safety_monitor.py 가 읽음). 프롬프트 2.2절.
# Moshi 가 음성과 함께 내보내는 텍스트 토큰을 실시간으로 이어 붙여 검사한다. 하나라도 걸리면 출력 음성을 끊고
# redirect_audio 를 재생한다.
# 목록은 초기값이다. 운영 전에 교육·법무 담당자가 검토하고 보강해야 한다.
#
# 검사 대상 텍스트는 정규화한 뒤 비교한다: 소문자, 곡선 따옴표 → ', 영문·숫자·'·@·. 이외 문자는 공백, 공백 하나로 합침.
# 따라서 pattern 은 "단어 사이에 공백 하나" 기준으로 쓴다.
#
# match 종류
#   word   : 단어 경계가 확인돼야 확정한다 (예: "ass" 는 "class", "assistant" 에서 걸리면 안 됨).
#            Moshi 토큰은 다음 단어의 앞 공백과 함께 오므로, 다음 토큰이 올 때까지(약 80ms) 확정이 늦어진다.
#   prefix : 단어 시작만 맞으면 바로 확정한다. 뒤에 무엇이 붙어도 위반인 어간에만 쓴다 (예: fuck → fucking).

version: 1

redirect_text: "Let's get back to our lesson."
redirect_audio: assets/redirect_en.wav   # 미리 녹음한 안내 음성 (아직 없음: GPU TTS 또는 녹음으로 준비)

# 이 구절 안에서 걸린 경우는 통과시킨다 (관용 표현).
exceptions:
  - cock a doodle
  - moby dick
  - water gun
  - toy gun
  - glue gun
  - photo bomb
  - weed the garden
  - no stupid question
  - no stupid questions

rules:
  # 금칙어
  - id: profanity_stem
    category: profanity
    match: prefix
    words: [fuck, motherfuck, shit, bullshit, bitch, cunt, dickhead, asshole, bastard, wanker, slut, whore]
  - id: profanity_word
    category: profanity
    match: word
    words: [ass, damn, dick, piss, pissed, crap, cock, prick, twat, retard, retarded]
  - id: insult
    category: insult
    match: word
    words: [stupid, idiot, dumb, moron, loser, shut up, you suck, i hate you]
  - id: sexual
    category: sexual
    match: word
    words: [sex, sexy, porn, porno, pornography, naked, nude, nudes, horny, orgasm, masturbate, masturbation, boobs, penis, vagina]
  - id: violence
    category: violence
    match: word
    words: [kill you, kill yourself, i will kill, murder, stab, shoot you, bomb, how to make a bomb, gun]
  - id: self_harm
    category: self_harm
    match: word
    words: [suicide, kill myself, kill yourself, hurt yourself, cut yourself, want to die]
  - id: drugs
    category: drugs
    match: word
    words: [cocaine, heroin, meth, weed, marijuana, get high, drugs]

  # 대화 상대에게 개인정보를 묻는 문장 (정규식)
  # "What is the capital of France?", "Where does the cat live?" 같은 학습 질문은 통과해야 하므로 상대(you/your)를 직접 가리키는 형태만 잡는다.
  - id: ask_address
    category: pii_request
    pattern: "(what(?:'s| is) your (?:home |house |street )?address|where do you live|where is your (?:house|home)|which (?:street|apartment|building) do you live)"
  - id: ask_phone
    category: pii_request
    pattern: "((?:what(?:'s| is)|tell me|give me|send me) your (?:mom's |dad's |mother's |father's |parents' )?(?:phone|cell|mobile)(?: phone)? number|your (?:phone|cell|mobile) number)"
  - id: ask_school
    category: pii_request
    pattern: "(what(?:'s| is) (?:the name of )?your school|which school do you (?:go to|attend)|where do you go to school|what school do you (?:go to|attend))"
  - id: ask_full_name
    category: pii_request
    pattern: "(what(?:'s| is) your (?:full|real|last|family) name|tell me your (?:full|real|last|family) name)"
  - id: ask_credentials
    category: pii_request
    pattern: "(your (?:password|passcode|pin number|credit card|bank account|social security))"
  - id: ask_photo_meet
    category: pii_request
    pattern: "(send me (?:a |your )?(?:photo|picture|pic|selfie)|can we meet (?:in person|somewhere|up)|let's meet (?:in person|up)|(?:i'll|i will|can i) come to your (?:house|home|school))"
  - id: ask_secret
    category: grooming
    pattern: "(don't tell your (?:mom|dad|parents|mother|father|teacher)|keep (?:this|it) (?:a )?secret from your|our little secret)"

# 답변 안에 들어 있으면 안 되는 개인정보 형태
# Moshi 가 숫자를 한 자리씩 토큰으로 내보내도 ▁ 가 없으면 붙어서 이어지므로("0","1","0" → "010") 묶음 안의 공백은 허용하지 않는다.
# 묶음 안 공백을 허용하면 "1, 2, 3, ... 10" 같은 숫자 세기 연습이 걸린다.
pii_value_rules:
  - id: phone_number
    category: pii_value
    pattern: "\\d{2,3}[ -]?\\d{3,4}[ -]?\\d{4}"
  - id: email
    category: pii_value
    pattern: "([a-z0-9._-]+ ?@ ?[a-z0-9-]+ ?\\. ?[a-z]{2,}|[a-z0-9]+ at [a-z0-9]+ dot (?:com|net|org|co))"
# 한계: 숫자를 단어로 읽는 경우("five five five ...")는 아직 잡지 않는다. 3단계에서 실제 Moshi 토큰을 보고 보강한다.
