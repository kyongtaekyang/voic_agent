# 운영 모드별 서비스와 기동 순서 (gpu-mode 가 읽음). gpu_layout.md 와 함께 고칠 것.
# <mode>   <순서> <서비스>            <필요GPU_MiB, 추정치 → 실측으로 갱신>
realtime   10     ko-gemma-vllm       11000
realtime   20     ko-realtime-server  4000
realtime   40     ko-web              0
# en-moshi: Moshi PyTorch INT8 (kyutai/moshiko-pytorch-q8). Rust INT8 대신 임시 대체. 12000 은 추정치(가중치만 8.0GB).
# services/en-moshi.sh 는 GPU 실측·사용자 승인 전까지 실행 권한 없음 → gpu-mode·gpu-wait 계산에서 빠진다.
realtime   50     en-moshi            12000
realtime   60     en-core             0
realtime   70     en-web              0
batch      10     transcribe-vllm     40000
# 학습 모드: 끝나는 작업 (services/finetune-job.sh). 단어 타임스탬프(Transcribe FP8)와 moshi-finetune 학습을 차례로 한다.
# 40000 은 두 단계 중 큰 쪽의 추정치 (moshi-finetune 공식 H100 측정 39.6 GB, batch 16·100초). 실측 후 고친다.
train      10     finetune-job        40000
# 영어 단독 프로필 (프롬프트 8.2절: 한쪽 Agent 만 운영하는 날). Moshi PyTorch BF16, 1단계 기능 검증용.
en-solo    10     en-moshi-bf16       24000
en-solo    20     en-core             0
en-solo    30     en-web              0
